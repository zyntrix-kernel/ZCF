# ZCF binfmt_misc configuration for systemd-binfmt.service
# Enables transparent execution of Windows PE and foreign architecture binaries via ZCF

# Windows PE32/PE32+ Executables (MZ magic: 4d 5a)
# Flags: P = preserve argv[0], C = check credentials/permissions
:zcf-pe:M::MZ::/usr/bin/zcf-runner:PC

# Foreign architecture ELF binaries (fallback through QEMU/Box64 via ZCF)
# ARM64 ELF on x86_64 host (ELF magic: \x7fELF, class 2, little-endian, ARM AArch64 machine 0xb7)
:zcf-elf-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/zcf-runner:PC
