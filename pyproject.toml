[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zyntrix-compatibility-fabric"
version = "0.1.0"
description = "Universal open-source application compatibility platform, runtime orchestrator, and research infrastructure"
readme = "README.md"
authors = [{ name = "Zyntrix Labs", email = "engineering@zyntrixlabs.org" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Operating System",
    "Topic :: Software Development :: Disassemblers"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zcf = "zcf.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
