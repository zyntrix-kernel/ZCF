name: ZCF Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Distro Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap \
            xvfb \
            xauth \
            desktop-file-utils \
            shared-mime-info \
            man-db \
            dpkg-dev

      - name: Run Test Suite
        env:
          PYTHONPATH: src
          ZCF_NON_INTERACTIVE: "1"
        run: |
          python3 -m unittest discover -s tests -v

      - name: Validate Packaging & Debian Package Generation
        run: |
          bash packaging/build_distro_packages.sh
          test -f build/zcf_0.2.0-1_all.deb
          echo "Debian package generated successfully."
